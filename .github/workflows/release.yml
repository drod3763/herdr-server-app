name: release

# One artifact per tag. The Local Network grant binds to the ad-hoc signature's cdhash, so
# the bundle is built exactly once per version here and never rebuilt on user machines.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, verify, smoke test
        run: |
          make check VERSION="${{ steps.version.outputs.version }}"
          make smoke VERSION="${{ steps.version.outputs.version }}"

      - name: Package
        run: make zip VERSION="${{ steps.version.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Herdr Server ${version}" \
            --notes-file release-notes.md \
            "build/Herdr-Server-${version}.zip" \
            "build/Herdr-Server-${version}.zip.sha256"
